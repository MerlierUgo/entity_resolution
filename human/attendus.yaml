# Réponses attendues des questions humaines · schéma du Manifest v0.1 (spec/manifest_schema.yaml)
#
# Une entrée par question de human/questions.csv. Tu écris ici TA réponse : ce que le moteur doit rendre.
# Une entrée vide (rien après « H-0xx: ») signifie « pas encore écrite ».
#
# Selon le statut, une seule de ces clés :
#   resolved      → manifest:        le cœur du Manifest (intent, champs, tri, limite)
#   ambiguous     → ambiguites:      [{terme, candidats: [au moins deux]}]
#   unknown       → inconnus:        [{terme, raison}]   raisons : spec/manifest_schema.yaml
#   out_of_scope  → hors_perimetre:  {sujet}
# Clé facultative partout : commentaire.
#
# Écris d'abord sans regarder les colonnes proposées dans questions.csv : le contrôle te montrera
# ensuite les écarts entre ta réponse et la proposition de départ, à arbitrer un par un.
#
# Contrôle : python build/human_questions.py check
# 
# Modèles (copier, puis adapter) :
#
#   H-0xx:
#     statut: ambiguous
#     ambiguites:
#       - {terme: "bruxelles", candidats: ["geo:commune:BE-21004", "mecanova:site:agence-bruxelle"]}
#
#   H-0xx:
#     statut: unknown
#     inconnus:
#       - {terme: "durites de frein", raison: absent_du_catalogue}
#
#   H-0xx:
#     statut: out_of_scope
#     hors_perimetre: {sujet: conseil}

