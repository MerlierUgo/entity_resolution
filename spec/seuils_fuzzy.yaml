# Seuils de l'étape approchée par famille (R-RES-10).
# Écrit par python -m engine.calibration : ne pas modifier à la main.
# Garantie SGR (Geifman et El-Yaniv, 2017) ; choix du seuil par test en séquence fixe (Angelopoulos et al., 2021,
# « Learn then Test », arXiv 2110.01052) : θ testés de 0,99 à 0,80, chacun au niveau δ, avec la borne binomiale
# exacte ; arrêt au premier échec ; θ retenu = le dernier qui a passé ; null = approché désactivé.
# n : noms résolus (resolved) par le fuzzy ; k : pertes dangereuses parmi eux ; couverture : n / saisies passées
# par l'approché. Seuil final = le plus strict des deux scénarios. Garantie valable si le réel est entre les
# deux scénarios (modèle v0.3 et pessimiste). volume_necessaire : estimation si les taux observés se maintiennent.
# Lu par le moteur : engine/approche.py · SeuilsCalibres.
