# Seuils de l'étape approchée par famille : calibration SGR (R-RES-10).
# Écrit par python -m engine.calibration : ne pas modifier à la main.
# Méthode : Geifman et El-Yaniv (2017), SGR. Pour chaque famille et chaque scénario de certification, θ est le
# plus petit seuil de la grille dont la borne haute du risque (binomiale exacte, δ' = δ / taille de la grille)
# est ≤ r*. Seuil final = le plus strict des deux scénarios ; null = approché désactivé pour la famille.
# n : noms acceptés par le fuzzy ; k : pertes dangereuses parmi eux ; couverture : n / saisies passées par
# l'approché. Garantie valable si le réel est entre les deux scénarios (modèle v0.3 et pessimiste).
# Lu par le moteur : engine/approche.py · SeuilsCalibres.
